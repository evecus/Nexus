name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-14

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Flutter ──────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      # ── 生成原生 runner ─────────────────────────────────────────────
      # 本仓库约定：各平台目录（windows/、linux/、android/ 等）只保留
      # Dart 源码 + pubspec + assets，原生 runner（Xcode 工程、
      # AppDelegate.swift 等）由 flutter create 在构建时生成、不入库。
      # macos/ 沿用同样的约定，详见 macos/README_MACOS_PORT.md。
      - name: Create macOS platform project
        working-directory: macos
        run: flutter create --platforms=macos .

      - name: Bump macOS deployment target to 11.0
        working-directory: macos/macos
        run: |
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.15;/MACOSX_DEPLOYMENT_TARGET = 11.0;/g' \
            Runner.xcodeproj/project.pbxproj
          sed -i '' "s/platform :osx, '10.15'/platform :osx, '11.0'/" Podfile

      - name: Remove default widget test
        working-directory: macos
        run: |
          rm -f test/widget_test.dart
          rmdir --ignore-fail-on-non-empty test 2>/dev/null || true

      # ── Dependencies ─────────────────────────────────────────────────
      - name: Get shared package dependencies
        run: flutter pub get

      - name: Get macOS app dependencies
        working-directory: macos
        run: flutter pub get

      # CocoaPods 拉取 vlc_player（VLCKit）/ media_kit 等插件的原生依赖。
      # flutter pub get 之后、build 之前需要先跑一遍 pod install，
      # 否则 build macos 阶段可能因为 Podfile.lock 未生成而失败。
      - name: Pod install
        working-directory: macos/macos
        run: pod install --repo-update

      - name: Generate launcher icon
        working-directory: macos
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: macos
        run: flutter analyze --no-fatal-infos

      - name: Build macOS (release)
        working-directory: macos
        run: flutter build macos --release

      # ── 定位生成的 .app ─────────────────────────────────────────────
      # 【风险点】macOS 端应用名默认来自 flutter create 生成的
      # macos/Runner/Configs/AppInfo.xcconfig 里的 PRODUCT_NAME（默认值
      # 是 "Runner"），不像 Windows/Linux 那样自动从 pubspec.yaml 的
      # name 字段派生，所以产物可能叫 Runner.app 而不是 nexus_macos.app。
      # 这里用通配查找实际生成的 .app，避免因为名字假设错误导致后续步骤
      # 找不到文件；如果想让产物固定叫 "Nexus.app"，可以在
      # flutter create 生成 macos/macos/ 之后、build 之前，把
      # macos/macos/Runner/Configs/AppInfo.xcconfig 里的
      # PRODUCT_NAME 改成 Nexus。
      - name: Locate built .app
        id: locate_app
        run: |
          src_dir="macos/build/macos/Build/Products/Release"
          app_path=$(find "$src_dir" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$app_path" ]; then
            echo "No .app bundle found under $src_dir" >&2
            exit 1
          fi
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "Found app bundle: $app_path"

      - name: Report Release size
        run: |
          size=$(du -sh "${{ steps.locate_app.outputs.app_path }}" | cut -f1)
          echo "Release .app bundle size: $size"

      # ── Ad-hoc codesign ─────────────────────────────────────────────
      # 不使用付费 Apple Developer 证书时，产物默认未签名，用户首次打开
      # 会被 Gatekeeper 拦截（"已损坏，无法打开"/"无法验证开发者"）。这里
      # 用本机自带的 ad-hoc 签名（identity "-"）签一遍，可以避免"已损坏"
      # 的报错，但用户首次打开仍需要在"系统设置 → 隐私与安全性"里手动允许，
      # 或执行 `xattr -cr Nexus.app` 去掉隔离属性。如果后续拿到正式的
      # Developer ID 证书，把 identity 换成证书名称即可支持公证
      # （notarization），不影响本工作流其余步骤。
      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - "${{ steps.locate_app.outputs.app_path }}"

      # ── Package into zip ─────────────────────────────────────────────
      # macOS 应用习惯直接打包 .app bundle 本身（而不是内部文件平铺），
      # 用 ditto 而不是 zip/Compress-Archive，以保留 .app 的目录结构、
      # 权限位和扩展属性（zip 命令行工具在部分场景下会丢失这些信息，
      # ditto 是 Apple 官方推荐的 .app 打包方式）。
      - name: Package release as zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.locate_app.outputs.app_path }}" \
            "Nexus-macOS.zip"

      # ── Create GitHub Release (optional, on version tags) ─────────────
      - name: Create Release on tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Nexus-test
          files: Nexus-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
