name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-2022

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Flutter ──────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows platform project
        working-directory: windows
        run: flutter create --platforms=windows .

      - name: Remove default widget test
        working-directory: windows
        shell: pwsh
        run: |
          if (Test-Path "test/widget_test.dart") {
            Remove-Item "test/widget_test.dart" -Force
          }
          if ((Get-ChildItem test -ErrorAction SilentlyContinue | Measure-Object).Count -eq 0) {
            Remove-Item test -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Analyze
        working-directory: windows
        run: flutter analyze --no-fatal-infos
      
      - name: clean Windows app dependencies
        working-directory: windows
        run: flutter clean

      # ── Dependencies ─────────────────────────────────────────────────
      - name: Get shared package dependencies
        run: flutter pub get

      - name: Get Windows app dependencies
        working-directory: windows
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: windows
        run: dart run flutter_launcher_icons

      - name: Build Windows (release, for main)
        working-directory: windows
        run: flutter build windows --release

      # ── Strip unused VLC plugins ─────────────────────────────────────
      # 删除 VLC runtime 里 IPTV/本地视频用不到的插件（DVD/蓝光/VCD/
      # 屏幕捕获/FTP/SMB/NFS 等），把 plugins/ 从 ~80MB 砍到 ~15MB。
      # 必须在 build 之后、打包 zip 之前执行。脚本逻辑见
      # windows/scripts/strip_vlc_plugins.ps1。
      - name: Strip unused VLC plugins
        working-directory: windows
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\strip_vlc_plugins.ps1

      - name: Report Release size
        shell: pwsh
        run: |
          $src = "windows\build\windows\x64\runner\Release"
          $size = (Get-ChildItem $src -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Release directory total size: {0:N1} MB" -f $size)

      # ── Package into zip ─────────────────────────────────────────────
      - name: Package release as ZIP
        shell: pwsh
        run: |
          $src = "windows\build\windows\x64\runner\Release"
          $dst = "Nexus-Windows-x64.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dst -Force

      # ── Create GitHub Release (optional, on version tags) ─────────────
      - name: Create Release on tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Nexus-test
          files: Nexus-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
