name: Build Android TV

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TV APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter ──────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      # ── Dependencies ─────────────────────────────────────────────────
      - name: Get shared package dependencies
        working-directory: shared
        run: flutter pub get

      - name: Get Android TV app dependencies
        working-directory: apps/android_tv
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: apps/android_tv
        run: dart run flutter_launcher_icons

      # ── Code quality ─────────────────────────────────────────────────
      - name: Analyze
        working-directory: apps/android_tv
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Clean & re-resolve deps before build
        working-directory: apps/android_tv
        run: |
          flutter clean
          flutter pub get

      # ── Keystore setup (release only) ─────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}" | base64 --decode \
            > apps/android_tv/android/app/keystore.jks

      - name: Write key.properties
        run: |
          cat > apps/android_tv/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_TV_KEY_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_TV_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_TV_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build tv APK (release, for main)
        working-directory: apps/android_tv
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 || {
            echo "flutter build exited non-zero (Flutter 3.44 watcher bug)."
            echo "Dart artifacts already written — retrying via Gradle directly..."
            cd android && ./gradlew assembleRelease
          }

      # ── Rename per-arch APKs ──────────────────────────────────────────
      # APK 路径已知，无需 find：直接从 flutter-apk/ 目录读取三个分架构包并重命名。
      - name: Rename APKs
        run: |
          APK_DIR="apps/android_tv/android/app/build/outputs/flutter-apk"
          OUT_DIR="$GITHUB_WORKSPACE/release-apks"
          mkdir -p "$OUT_DIR"
          for arch in arm64-v8a armeabi-v7a; do
            src="$APK_DIR/app-${arch}-release.apk"
            dst="$OUT_DIR/nexus-tv-${arch}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "[OK] $src -> $dst"
            else
              echo "[WARN] Not found: $src"
            fi
          done
          echo "=== Final release APKs ==="
          ls -lh "$OUT_DIR/" || echo "(none)"

      # ── Publish GitHub Release ────────────────────────────────────────
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Nexus-test
          files: release-apks/*.apk
