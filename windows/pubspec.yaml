name: nexus_windows
version: 1.0.0+1
publish_to: none
description: "Nexus for Windows desktop"

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  player_shared:
    path: ../

  get: ^4.7.3
  hive_flutter: 1.1.0
  media_kit: ^1.2.2
  media_kit_video: ^2.0.0
  media_kit_libs_video: ^1.0.7

  # IPTV 直播流备用后端：libVLC 对 HLS/TS/RTMP 兼容性比 mpv 更好，
  # 在 settings 里可切换。Windows 构建时自动下载 VLC runtime（libvlc.dll /
  # libvlccore.dll / plugins/）并打包到 Release 目录。
  # 注意：flutter_vlc_player 只支持 Android/iOS，Windows 必须用 vlc_player。
  vlc_player: ^2.1.2

  # 视频缩略图原生取帧(Media Foundation)，比 media_kit 截图快，见
  # video_tab_page.dart 的 _generateWithFcNative
  fc_native_video_thumbnail: ^3.0.1

  cupertino_icons: ^1.0.8
  dynamic_color: ^1.8.1
  flutter_smart_dialog: ^4.9.8+9

  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  file_picker: ^10.3.7
  window_manager: ^0.5.1
  tray_manager: ^0.5.1
  screen_retriever: ^0.2.0
  wakelock_plus: ^1.4.0
  connectivity_plus: 7.0.0
  collection: any
  intl: ^0.20.2
  path: any
  dio: ^5.9.0

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
