name: nexus
version: 1.0.0+1
publish_to: none
description: "Nexus for Windows desktop"

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  player_shared:
    path: ../../shared

  get: ^4.7.3
  hive_flutter: 1.1.0
  media_kit: ^1.2.2
  media_kit_video: ^2.0.0
  media_kit_libs_video: ^1.0.7
  vlc_player: ^2.1.2

  fc_native_video_thumbnail: ^3.0.1

  cupertino_icons: ^1.0.8
  dynamic_color: ^1.8.1
  flutter_smart_dialog: ^4.9.8+9

  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  file_picker: ^10.3.7
  window_manager: ^0.5.1
  tray_manager: ^0.5.1
  screen_retriever: ^0.2.0
  wakelock_plus: ^1.4.0
  connectivity_plus: 7.0.0
  collection: any
  intl: ^0.20.2
  path: any
  dio: ^5.9.0

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
