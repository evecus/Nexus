name: fc_native_video_thumbnail
description: >
  Linux-only stub replacing the real fc_native_video_thumbnail plugin via
  dependency_overrides (see ../../pubspec.yaml). Pure Dart, no native
  implementation for any platform — see README.md for why this exists.
version: 3.0.1
publish_to: none

environment:
  sdk: ">=3.0.5 <4.0.0"

# 有意不声明 `flutter: plugin: platforms:` 小节。真正的
# fc_native_video_thumbnail 包在这里声明了 android/ios/macos/windows 的
# 原生实现（其中 windows/ 和一份 Linux 实现都通过 pkg_check_modules 链接
# 系统 FFmpeg 的 libavformat/libavcodec/libavutil/libswscale）。
# 一旦某个包在依赖图里出现且声明了某平台的原生实现，Flutter 的
# `flutter build linux` 就会无条件把该平台对应的原生代码编译进最终产物，
# 不管 Dart 代码运行时是否真的调用得到它（本项目里 fc_native_video_thumbnail
# 只在 Platform.isWindows 分支下才会被调用，见
# ../../../../shared/lib/src/media_cache/video_thumbnail_generator.dart，Linux 端
# 从未真正用到它）。
#
# 这份桩包完全不带任何 `flutter:` plugin 声明，因此 Flutter 的插件注册
# 机制找不到任何平台的原生实现可编译，`flutter build linux` 不会再尝试
# 链接 FFmpeg。桩包里的 saveThumbnailToFile 方法即便被意外调用，也只是
# 直接返回 false（等同于"取帧失败"），调用方 video_thumbnail_generator.dart
# 会自动回退到 media_kit 截图方案，行为与真实插件在"取帧失败"时完全一致。

dependencies:
  flutter:
    sdk: flutter
