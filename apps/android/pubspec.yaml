name: nexus
version: 1.0.0+1
publish_to: none
description: "Nexus for Android (phone & tablet)"

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  player_shared:
    path: ../../shared

  # State management & routing
  get: ^4.7.3

  # Storage (init done via player_shared)
  hive_flutter: 1.1.0

  # Video / Audio
  media_kit: ^1.2.2
  media_kit_video: ^2.0.0
  media_kit_libs_video: ^1.0.7
  video_player: ^2.9.2

  # UI
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.8.1
  flutter_smart_dialog: ^4.9.8+9

  # System
  package_info_plus: ^9.0.0
  device_info_plus: 12.2.0
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  file_picker: ^10.3.7
  path_provider: ^2.1.5
  screen_brightness: ^2.1.7
  volume_controller: ^3.4.0
  auto_orientation_v2: ^2.3.6
  wakelock_plus: ^1.4.0
  floating: ^6.0.0
  connectivity_plus: 7.0.0
  collection: any
  intl: ^0.20.2
  path: any
  dio: ^5.9.0

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
